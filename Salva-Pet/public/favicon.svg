<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="salvaPetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fad817" />
      <stop offset="100%" stop-color="#f5c000" />
    </linearGradient>
    <filter id="sombraSuave" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#7d4f05" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Fundo Circular Amarelo com Borda Marrom SalvaPet -->
  <circle cx="32" cy="32" r="30" fill="url(#salvaPetGrad)" stroke="#7d4f05" stroke-width="2.5" />

  <!-- Patinha em Marrom SalvaPet -->
  <g fill="#5a3800" filter="url(#sombraSuave)">
    <!-- Almofada Central em forma de Coração Suave -->
    <path d="M 32 46 C 24 46, 21 38, 24 33 C 26 29, 30 28, 32 31 C 34 28, 38 29, 40 33 C 43 38, 40 46, 32 46 Z" />
    
    <!-- 4 Dedinhos da Patinha -->
    <ellipse cx="21" cy="24" rx="4" ry="5.5" transform="rotate(-25 21 24)" />
    <ellipse cx="28.5" cy="19" rx="4.2" ry="6" transform="rotate(-8 28.5 19)" />
    <ellipse cx="35.5" cy="19" rx="4.2" ry="6" transform="rotate(8 35.5 19)" />
    <ellipse cx="43" cy="24" rx="4" ry="5.5" transform="rotate(25 43 24)" />
  </g>

  <!-- Pequeno Coraçãozinho no Centro da Pata em Amarelo Dourado -->
  <path d="M 32 40 C 29.5 40, 28 36.5, 29.5 34.5 C 30.5 33, 31.8 33, 32 34 C 32.2 33, 33.5 33, 34.5 34.5 C 36 36.5, 34.5 40, 32 40 Z" fill="#fad817" />
</svg>